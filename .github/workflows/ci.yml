name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install pre-commit hooks
        run: |
          pre-commit install
          pre-commit run --all-files

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Safety check (dependency vulnerabilities)
        run: |
          pip install safety
          safety check --full-report || true

      - name: Bandit security scan
        run: |
          pip install bandit
          bandit -r . -x tests/ -ll --skip=B101,B601

      - name: Build Docker image
        run: |
          docker build -t api-prediccion-salarios:test .

      - name: Test Docker container runs
        run: |
          docker run -d --name test-container -p 8000:8000 api-prediccion-salarios:test
          sleep 10
          curl -f http://localhost:8000/health || (docker logs test-container && exit 1)
          docker stop test-container
          docker rm test-container
